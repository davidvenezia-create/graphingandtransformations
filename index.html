<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph Lab</title>
<meta name="description" content="Learn the parts of a graph, plot points, and move emoji with transformations.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2B59FF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --paper:#F2F8FB; --grid:#CFE0E9; --ink:#14233B; --ink-soft:#4B5D76;
  --blue:#2B59FF; --blue-soft:#DDE6FF;
  --pink:#E8388A; --pink-soft:#FFE1EF;
  --sun:#FFC533; --sun-soft:#FFF1C4;
  --mint:#12905F; --mint-soft:#D5F4E6;
  --white:#fff;
  --shadow:4px 4px 0 var(--ink);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:12px}
body{
  margin:0; font-family:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:17px; line-height:1.5; color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
h1,h2,h3,.btn,.tab,.chip,.seg button,.tool,.sb,output{font-family:'Fredoka','Lexend',system-ui,sans-serif}
h1{font-size:2.1rem; line-height:1.1; margin:0; font-weight:700}
h2{font-size:1.45rem; margin:0 0 6px; font-weight:600}
h3{font-size:1.15rem; margin:14px 0 6px; font-weight:600}
p{margin:0 0 10px}
hr{border:0; border-top:2px dashed var(--grid); margin:16px 0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.skip{position:absolute; left:-999px; top:8px; background:var(--sun); padding:8px 14px; border:2px solid var(--ink); border-radius:999px; z-index:10}
.skip:focus{left:12px}
:focus-visible{outline:3px solid var(--ink); outline-offset:3px; box-shadow:0 0 0 6px var(--sun)}
.wrap{max-width:1180px; margin:0 auto; padding:0 20px}
.top{padding-top:18px; padding-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:14px}
.logo{width:66px; height:auto}
.sub{margin:2px 0 0; color:var(--ink-soft); font-size:.98rem}
.seg{display:inline-flex; border:2px solid var(--ink); border-radius:999px; overflow:hidden; background:#fff; flex-wrap:wrap}
.seg button{border:0; background:transparent; padding:.45rem 1rem; font-size:1rem; font-weight:600; cursor:pointer; color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink); color:#fff}
.card{background:#fff; border:2px solid var(--ink); border-radius:18px; box-shadow:var(--shadow); padding:16px 18px; margin-bottom:18px}
.idbar{display:flex; gap:14px; align-items:end; flex-wrap:wrap; padding:10px 16px}
.idbar label{display:flex; flex-direction:column; font-size:.85rem; font-weight:500; color:var(--ink-soft); gap:2px}
.idbar input{font:inherit; font-size:1rem; padding:.4rem .7rem; border:2px solid var(--ink); border-radius:10px; width:12rem; max-width:100%}
.idbar input#id-period{width:6rem}
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 16px}
.tab{border:2px solid var(--ink); background:#fff; border-radius:999px; padding:.5rem 1rem; font-size:1rem; font-weight:600; cursor:pointer; color:var(--ink); box-shadow:2px 2px 0 var(--ink)}
.tab[aria-selected=true]{background:var(--blue); color:#fff}
.tab.done::after{content:" ✓"}
.btn{border:2px solid var(--ink); background:#fff; border-radius:999px; padding:.5rem 1.1rem; font-size:1rem; font-weight:600; cursor:pointer; color:var(--ink); box-shadow:2px 2px 0 var(--ink); margin:4px 8px 4px 0}
.btn:active{transform:translate(2px,2px); box-shadow:none}
.btn.primary{background:var(--blue); color:#fff}
.btn.sun{background:var(--sun)}
.btn.ghost{box-shadow:none; background:transparent}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 10px}
.chip{border:2px solid var(--ink); background:#fff; border-radius:999px; padding:.3rem .85rem; font-size:1rem; font-weight:500; cursor:pointer; color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink); color:#fff}
.chip.emo{font-size:1.5rem; padding:.1rem .5rem; line-height:1.3}
.chip.emo[aria-pressed=true]{background:var(--sun); color:var(--ink)}
.row{display:flex; flex-wrap:wrap; align-items:center; margin:6px 0}
.split{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:20px; align-items:start}
.gridcard{padding:10px}
.gridcard svg{width:100%; height:auto; display:block; max-width:640px; margin:0 auto}
svg.click{cursor:crosshair; touch-action:manipulation}
.emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.big{font-family:'Fredoka',sans-serif; font-size:1.2rem; font-weight:600; margin:6px 0 10px}
.muted{color:var(--ink-soft); font-size:.92rem}
.fb{border:2px solid var(--ink); border-radius:14px; padding:10px 14px; margin:10px 0; font-weight:500}
.fb.ok{background:var(--mint-soft)} .fb.bad{background:var(--pink-soft)} .fb.info{background:var(--sun-soft)}
.info{background:var(--blue-soft); border:2px solid var(--ink); border-radius:14px; padding:10px 14px; margin:10px 0}
.info .term{font-family:'Fredoka',sans-serif; font-size:1.2rem; margin-bottom:4px}
.info .term .es{color:var(--pink); margin-left:.4em}
.goal{background:var(--sun-soft); border:2px solid var(--ink); border-radius:14px; padding:8px 14px; margin:8px 0}
.stepper{display:inline-flex; align-items:center; gap:6px; margin:4px 14px 4px 0}
.stepper .sl{font-size:.92rem; color:var(--ink-soft); margin-right:2px}
.sb{width:42px; height:42px; border-radius:50%; border:2px solid var(--ink); background:var(--sun); font-size:1.4rem; font-weight:700; cursor:pointer; color:var(--ink); line-height:1; padding:0}
.sb:active{transform:translate(1px,1px)}
output{min-width:3.4ch; text-align:center; font-size:1.35rem; font-weight:600; display:inline-block}
.tbl{width:100%; border-collapse:collapse; background:#fff}
.tbl th,.tbl td{border:2px solid var(--ink); padding:6px 8px; text-align:center}
.tbl th{background:var(--blue-soft); font-family:'Fredoka',sans-serif; font-weight:600}
.tools{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:8px 0 10px}
.tool{border:2px solid var(--ink); background:#fff; border-radius:14px; padding:8px 4px; cursor:pointer; text-align:center; font-size:1.05rem; font-weight:600; color:var(--ink); line-height:1.15}
.tool small{display:block; font-family:'Lexend',sans-serif; font-weight:400; font-size:.78rem; color:var(--ink-soft)}
.tool[aria-pressed=true]{background:var(--blue); color:#fff} .tool[aria-pressed=true] small{color:#fff}
.rule{background:var(--pink-soft); border:2px solid var(--ink); border-radius:14px; padding:10px 14px; margin:10px 0}
.rule .alg{font-family:'Fredoka',sans-serif; font-size:1.3rem; font-weight:600}
.frame{margin:0 0 6px; font-weight:500} .frame small{display:block; color:var(--ink-soft); font-weight:400}
textarea{width:100%; font:inherit; padding:10px; border:2px solid var(--ink); border-radius:12px; resize:vertical}
.mis{display:flex; gap:8px; flex-wrap:wrap; margin:6px 0}
.mis .chip.done::after{content:" ✓"}
.wall-wrap{padding-bottom:40px}
.wall{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px}
.wall div{background:#fff; border:2px solid var(--ink); border-radius:12px; padding:6px 10px; line-height:1.25}
.wall b{display:block} .wall span{color:var(--pink); font-weight:500}
@media (max-width:880px){.split{grid-template-columns:minmax(0,1fr)} h1{font-size:1.7rem} .tools{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>

/* ---------- small helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(n){n=Math.round(n*100)/100;return (n<0?'\u2212':'')+String(Math.abs(n));}
function pt(x,y){return '('+fmt(x)+', '+fmt(y)+')';}
function ptL(x,y){return '('+(Math.round(x*100)/100)+', '+(Math.round(y*100)/100)+')';}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=ri(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sgn(n){return n>0?1:n<0?-1:0;}
function tl(k,l){var d=I18N[l];return d&&d[k]!==undefined?d[k]:k;}
var S={lang:'en',tab:'num',name:'',period:'',write:''};
function t(k,p){var s=tl(k,S.lang);if(s===k&&I18N.en[k]!==undefined)s=I18N.en[k];if(p)s=s.replace(/\{(\w+)\}/g,function(m,n){return p[n]!==undefined?p[n]:m;});return s;}
function store(k,v){try{if(v===undefined)return localStorage.getItem('graphlab.'+k);if(v===null)localStorage.removeItem('graphlab.'+k);else localStorage.setItem('graphlab.'+k,v);}catch(e){}return null;}
function reduceMotion(){try{return window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}}

/* ---------- logging ---------- */
var started=false, once={};
function log(o){
  if(!LOGGER.enabled)return;
  try{
    var d={app:LOGGER.app,student:S.name||'unknown',period:S.period||'unknown'};
    for(var k in o)d[k]=o[k];
    fetch(LOGGER.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)}).catch(function(){});
  }catch(e){}
}
function logOnce(key,o){if(once[key])return;once[key]=1;log(o);}
function logStart(){if(started)return;started=true;log({event:'start',station:'tab-'+S.tab});}

/* ---------- SVG drawing ---------- */
function gx(x){return C+U*x;} function gy(y){return C-U*y;}
function arrow(x,y,d){var X=gx(x),Y=gy(y),p;
  if(d==='r')p=[X,Y,X-12,Y-6,X-12,Y+6]; else if(d==='l')p=[X,Y,X+12,Y-6,X+12,Y+6]; else if(d==='u')p=[X,Y,X-6,Y+12,X+6,Y+12]; else p=[X,Y,X-6,Y-12,X+6,Y-12];
  return '<polygon points="'+p.join(' ')+'" fill="'+COL.ink+'"/>';}
function grid(o){
  var s='<rect x="1" y="1" width="610" height="610" rx="14" fill="#fff"/>',i;
  if(o.lines){for(i=-R;i<=R;i++){s+='<line x1="'+gx(i)+'" y1="'+gy(-R)+'" x2="'+gx(i)+'" y2="'+gy(R)+'" stroke="'+COL.grid+'" stroke-width="1.5"/><line x1="'+gx(-R)+'" y1="'+gy(i)+'" x2="'+gx(R)+'" y2="'+gy(i)+'" stroke="'+COL.grid+'" stroke-width="1.5"/>';}}
  s+=o.under||'';
  var showX=o.x!==false,showY=o.y!==false;
  if(showX){
    s+='<line x1="'+gx(-8.7)+'" y1="'+gy(0)+'" x2="'+gx(8.7)+'" y2="'+gy(0)+'" stroke="'+COL.ink+'" stroke-width="3"/>'+arrow(8.95,0,'r')+arrow(-8.95,0,'l');
    s+='<text x="'+gx(8.2)+'" y="'+(gy(0)-14)+'" font-size="18" font-weight="700" fill="'+COL.blue+'" font-style="italic">x</text>';
    for(i=-R;i<=R;i++){s+='<line x1="'+gx(i)+'" y1="'+(gy(0)-5)+'" x2="'+gx(i)+'" y2="'+(gy(0)+5)+'" stroke="'+COL.ink+'" stroke-width="2"/>';
      if(i!==0)s+='<text x="'+gx(i)+'" y="'+(gy(0)+22)+'" text-anchor="middle" font-size="13" fill="'+COL.soft+'">'+fmt(i)+'</text>';}
  }
  if(showY){
    s+='<line x1="'+gx(0)+'" y1="'+gy(-8.7)+'" x2="'+gx(0)+'" y2="'+gy(8.7)+'" stroke="'+COL.ink+'" stroke-width="3"/>'+arrow(0,8.95,'u')+arrow(0,-8.95,'d');
    s+='<text x="'+(gx(0)+14)+'" y="'+(gy(8.2)+5)+'" font-size="18" font-weight="700" fill="'+COL.mint+'" font-style="italic">y</text>';
    for(i=-R;i<=R;i++){s+='<line x1="'+(gx(0)-5)+'" y1="'+gy(i)+'" x2="'+(gx(0)+5)+'" y2="'+gy(i)+'" stroke="'+COL.ink+'" stroke-width="2"/>';
      if(i!==0)s+='<text x="'+(gx(0)-10)+'" y="'+(gy(i)+4)+'" text-anchor="end" font-size="13" fill="'+COL.soft+'">'+fmt(i)+'</text>';}
  }
  if(showX&&showY)s+='<text x="'+(gx(0)-10)+'" y="'+(gy(0)+20)+'" text-anchor="end" font-size="13" fill="'+COL.soft+'">0</text>';
  return s+(o.over||'');
}
function svgWrap(id,label,inner,clickable){return '<svg class="grid'+(clickable?' click':'')+'" data-grid="'+id+'" viewBox="0 0 612 612" role="img" aria-label="'+esc(label)+'">'+inner+'</svg>';}
function halo(x,y,fill,r){return '<circle cx="'+gx(x)+'" cy="'+gy(y)+'" r="'+(r||18)+'" fill="'+fill+'" stroke="'+COL.ink+'" stroke-width="2"/>';}
function emojiAt(x,y,ch,M,size,op){
  var A=1,B=0,Cc=0,Dd=1;
  if(M){A=M[0][0];B=-M[1][0];Cc=-M[0][1];Dd=M[1][1];}
  return '<g transform="translate('+gx(x)+' '+gy(y)+') matrix('+A+' '+B+' '+Cc+' '+Dd+' 0 0)"'+(op?' opacity="'+op+'"':'')+'><text class="emo" text-anchor="middle" dy=".35em" font-size="'+(size||24)+'">'+ch+'</text></g>';
}
function lab(x,y,txt,col,dx,dy){return '<text x="'+(gx(x)+(dx===undefined?16:dx))+'" y="'+(gy(y)+(dy===undefined?-14:dy))+'" font-size="14" font-weight="700" fill="'+col+'" stroke="#fff" stroke-width="4" paint-order="stroke">'+txt+'</text>';}
function leg(x1,y1,x2,y2,col){
  if(x1===x2&&y1===y2)return '';
  var X1=gx(x1),Y1=gy(y1),X2=gx(x2),Y2=gy(y2),dx=X2-X1,dy=Y2-Y1,L=Math.sqrt(dx*dx+dy*dy),ux=dx/L,uy=dy/L,bx=X2-ux*13,by=Y2-uy*13;
  return '<line x1="'+X1+'" y1="'+Y1+'" x2="'+bx+'" y2="'+by+'" stroke="'+col+'" stroke-width="4" stroke-dasharray="7 6" stroke-linecap="round"/><polygon points="'+X2+','+Y2+' '+(bx-uy*7)+','+(by+ux*7)+' '+(bx+uy*7)+','+(by-ux*7)+'" fill="'+col+'"/>';
}
function walkLegs(x,y){return leg(0,0,x,0,COL.blue)+leg(x,0,x,y,COL.mint);}
function quadRect(q,fill){var x=q==='I'||q==='IV'?0:-R-0.7,y=q==='I'||q==='II'?R+0.7:0,w=q==='I'||q==='IV'?R+0.7:R+0.7;
  return '<rect x="'+gx(x)+'" y="'+gy(y)+'" width="'+(w*U)+'" height="'+((R+0.7)*U)+'" fill="'+fill+'" opacity=".7"/>';}
function quadOf(x,y){if(x===0&&y===0)return 'origin';if(y===0)return 'xaxis';if(x===0)return 'yaxis';if(x>0)return y>0?'I':'IV';return y>0?'II':'III';}
function signWord(n){return t(n>0?'sg.pos':n<0?'sg.neg':'sg.zero');}
function whereText(p){var q=quadOf(p.x,p.y);return q==='origin'?t('qi.origin'):q==='xaxis'?t('qi.xaxis'):q==='yaxis'?t('qi.yaxis'):t('qi.quad',{q:q});}

/* ---------- UI builders ---------- */
function B(label,act,data,cls,extra){var a='',k;for(k in (data||{}))a+=' data-'+k+'="'+esc(data[k])+'"';return '<button type="button" class="btn'+(cls?' '+cls:'')+'" data-act="'+act+'"'+a+(extra||'')+'>'+label+'</button>';}
function CH(label,act,data,on,cls){var a='',k;for(k in (data||{}))a+=' data-'+k+'="'+esc(data[k])+'"';return '<button type="button" class="chip'+(cls?' '+cls:'')+'" data-act="'+act+'"'+a+' aria-pressed="'+(on?'true':'false')+'">'+label+'</button>';}
function stepper(key,label,val,dis){return '<div class="stepper" role="group" aria-label="'+esc(label)+'"><span class="sl">'+label+'</span><button type="button" class="sb" data-act="step" data-k="'+key+'" data-d="-1" aria-label="'+esc(label)+' \u2212 1"'+(dis?' disabled':'')+'>\u2212</button><output>'+fmt(val)+'</output><button type="button" class="sb" data-act="step" data-k="'+key+'" data-d="1" aria-label="'+esc(label)+' + 1"'+(dis?' disabled':'')+'>+</button></div>';}
function fbHtml(m){if(!m)return '';var p={},k;if(m.p)for(k in m.p)p[k]=m.p[k];if(m.tk)for(k in m.tk)p[k]=t(m.tk[k]);return '<div class="fb '+m.c+'">'+t(m.k,p)+'</div>';}
function nextBtn(id){return '<div class="row">'+B(t('next')+' '+t('tab.'+id),'tab',{v:id},'primary')+'</div>';}
function seg(items,act,cur,key){var h='<div class="seg" role="group">';items.forEach(function(it){h+='<button type="button" data-act="'+act+'" data-v="'+it[0]+'" aria-pressed="'+(cur===it[0]?'true':'false')+'">'+it[1]+'</button>';});return h+'</div>';}
function wk(x,y){
  var a=x>0?t('wk.xr',{n:x}):x<0?t('wk.xl',{n:-x}):t('wk.x0');
  var b=y>0?t('wk.yu',{n:y}):y<0?t('wk.yd',{n:-y}):t('wk.y0');
  return a+' '+b;
}

  var n=G.num,fx=n.vert?0:n.pos,fy=n.vert?n.pos:0;
  return grid({lines:n.showGrid,y:n.showY,over:halo(fx,fy,COL.mintS)+emojiAt(fx,fy,'🐸')});
}
function pNum(){
  var n=G.num,g=NUMGOALS[n.gi],fin=n.gi>=NUMGOALS.length,h;
  h='<div class="split"><div class="card gridcard">'+svgWrap('num',t('num.alt'),numSVG())+'</div><div class="card">';
  h+='<h2>'+t('num.h')+'</h2><p>'+t('num.p1')+'</p>'+(n.showY?'<p>'+t('num.p2')+'</p>':'');
  h+='<p class="big">'+t('num.at',{n:fmt(n.pos),line:t(n.vert?'num.yline':'num.xline')})+'</p>';
  h+='<div class="row">'+B(t(n.vert?'num.down':'num.left'),'hop',{d:-1},'sun')+B(t(n.vert?'num.up':'num.right'),'hop',{d:1},'sun')+'</div>';
  if(n.showY)h+='<div class="chips">'+CH(t('num.useX'),'line',{v:'h'},!n.vert)+CH(t('num.useY'),'line',{v:'v'},n.vert)+'</div>';

function hitTest(ux,uy){
  if(Math.abs(ux)>8.95||Math.abs(uy)>8.95)return 'out';

  if(Math.abs(uy)<0.4)return ux>0?'xpos':'xneg';

  return ux>0?(uy>0?'q1':'q4'):(uy>0?'q2':'q3');

/* ---------- TAB 5: practice ---------- */
function genRound(level){
  var qs=[],used={},x,y,guard=0;
  while(qs.length<8&&guard++<500){
    if(level===1){x=ri(1,8);y=ri(1,8);}
    else if(level===2){x=ri(-8,8);y=ri(-8,8);if(!x||!y)continue;}
    else if(qs.length%3===2){if(Math.random()<.5){x=0;y=ri(-8,8);}else{x=ri(-8,8);y=0;}if(!x&&!y)continue;}
    else{x=ri(-8,8);y=ri(-8,8);if(!x||!y)continue;}
    if(used[x+','+y])continue;used[x+','+y]=1;
    qs.push({x:x,y:y,e:EMO[ri(0,EMO.length-1)]});
  }
  return qs;
}
function diagnose(q,a){
  if(a.x===q.x&&a.y===q.y)return 'correct';
  if(a.x===q.y&&a.y===q.x)return 'swapped-xy';
  var sx=sgn(a.x)!==sgn(q.x),sy=sgn(a.y)!==sgn(q.y);
  if(sx&&sy)return 'wrong-signs';if(sx)return 'wrong-sign-x';if(sy)return 'wrong-sign-y';return 'other';
}
var FBKEY={'swapped-xy':'fb.swapped','wrong-sign-x':'fb.signx','wrong-sign-y':'fb.signy','wrong-signs':'fb.signs','other':'fb.other'};
function pracSVG(){
  var P=G.prac,q=P.qs[Math.min(P.i,P.qs.length-1)],u='',o='',solved=P.res&&P.res.code==='correct';

  else if(P.pick.set){o+=halo(P.pick.x,P.pick.y,solved?COL.mintS:COL.pinkS)+emojiAt(P.pick.x,P.pick.y,q.e);if(solved)o+=lab(q.x,q.y,pt(q.x,q.y),COL.ink);}
  return grid({lines:true,under:u,over:o});
}

function pracCheck(){
  var P=G.prac,q=P.qs[P.i],a=P.mode==='plot'?P.pick:P.ans,st='practice-L'+P.level+'-'+P.mode;

  }else{

  }

/* ---------- TAB 6: emoji moves ---------- */
var MOV={
  slide:function(p,m){return {x:p.x+m.dx,y:p.y+m.dy};},
  flip:function(p,m){return m.mirror==='x'?{x:p.x,y:-p.y}:m.mirror==='y'?{x:-p.x,y:p.y}:{x:p.y,y:p.x};},
  turn:function(p,m){return m.turn==='ccw90'?{x:-p.y,y:p.x}:m.turn==='cw90'?{x:p.y,y:-p.x}:{x:-p.x,y:-p.y};},
  resize:function(p,m){return {x:p.x*m.k,y:p.y*m.k};}
};
function MM(m){
  if(m.type==='flip')return m.mirror==='x'?[[1,0],[0,-1]]:m.mirror==='y'?[[-1,0],[0,1]]:[[0,1],[1,0]];
  if(m.type==='turn')return m.turn==='ccw90'?[[0,-1],[1,0]]:m.turn==='cw90'?[[0,1],[-1,0]]:[[-1,0],[0,-1]];
  return [[1,0],[0,1]];
}
function mm(A,B2){return [[A[0][0]*B2[0][0]+A[0][1]*B2[1][0],A[0][0]*B2[0][1]+A[0][1]*B2[1][1]],[A[1][0]*B2[0][0]+A[1][1]*B2[1][0],A[1][0]*B2[0][1]+A[1][1]*B2[1][1]]];}
function startPts(){var L=G.lab;return L.shape==='trio'?[{x:L.sx,y:L.sy},{x:L.sx+2,y:L.sy},{x:L.sx+1,y:L.sy+2}]:[{x:L.sx,y:L.sy}];}
function labBase(){
  var L=G.lab,pts=startPts(),M=[[1,0],[0,1]],k=1;
  L.moves.forEach(function(m){pts=pts.map(function(p){return MOV[m.type](p,m);});M=mm(MM(m),M);if(m.type==='resize')k*=m.k;});
  return {pts:pts,M:M,k:k};
}
function labPend(){
  var L=G.lab;
  if(L.tool==='slide')return (L.dx||L.dy)?{type:'slide',dx:L.dx,dy:L.dy}:null;
  if(L.tool==='flip')return L.mirror?{type:'flip',mirror:L.mirror}:null;
  if(L.tool==='turn')return L.turn?{type:'turn',turn:L.turn}:null;
  return L.k?{type:'resize',k:L.k}:null;
}
function labImg(){var b=labBase(),m=labPend();if(!m)return null;return {pts:b.pts.map(function(p){return MOV[m.type](p,m);}),M:mm(MM(m),b.M),k:b.k*(m.type==='resize'?m.k:1),move:m};}
function gsize(k){return 24*Math.min(2,Math.max(0.7,k));}
function usedTypes(){var u=[];G.lab.moves.forEach(function(m){if(u.indexOf(m.type)<0)u.push(m.type);});var p=labPend();if(p&&u.indexOf(p.type)<0)u.push(p.type);return u;}
function sgnTxt(v){return v>0?'+ '+v:'\u2212 '+(-v);}
function ruleAlg(m){
  if(m.type==='slide')return '(x, y) \u2192 (x'+(m.dx?' '+sgnTxt(m.dx):'')+', y'+(m.dy?' '+sgnTxt(m.dy):'')+')';
  if(m.type==='flip')return '(x, y) \u2192 '+(m.mirror==='x'?'(x, \u2212y)':m.mirror==='y'?'(\u2212x, y)':'(y, x)');
  if(m.type==='turn')return '(x, y) \u2192 '+(m.turn==='ccw90'?'(\u2212y, x)':m.turn==='cw90'?'(y, \u2212x)':'(\u2212x, \u2212y)');
  return m.k===0.5?'(x, y) \u2192 (\u00BDx, \u00BDy)':'(x, y) \u2192 ('+m.k+'x, '+m.k+'y)';
}
function ruleWords(m){
  if(m.type==='slide'){var a=[];if(m.dx)a.push(t(m.dx>0?'w.right':'w.left',{n:Math.abs(m.dx)}));if(m.dy)a.push(t(m.dy>0?'w.up':'w.down',{n:Math.abs(m.dy)}));return t('w.slide',{m:a.join(t('w.and'))});}
  if(m.type==='flip')return t(m.mirror==='x'?'w.flipx':m.mirror==='y'?'w.flipy':'w.flipd');
  if(m.type==='turn')return t('w.turn',{a:t('turn.'+m.turn)});
  return m.k===0.5?t('w.resizeh'):t('w.resize',{k:m.k});
}
function labSVG(){
  var L=G.lab,b=labBase(),im=labImg(),u='',o='',mis=L.mode==='mission'?MIS[L.mi]:null,i,LET=['A','B','C'];
  if(mis){o+='<circle cx="'+gx(mis.t[0])+'" cy="'+gy(mis.t[1])+'" r="23" fill="'+COL.mintS+'" stroke="'+COL.mint+'" stroke-width="3" stroke-dasharray="5 4"/>'+emojiAt(mis.t[0],mis.t[1],mis.te);}
  if(L.moves.length){startPts().forEach(function(p){o+=emojiAt(p.x,p.y,L.mode==='mission'?MIS[L.mi].e:L.emoji,null,20,'.3');});}
  if(L.shape==='trio'){var poly=function(pts,c){return '<polygon points="'+pts.map(function(p){return gx(p.x)+','+gy(p.y);}).join(' ')+'" fill="'+c+'" fill-opacity=".12" stroke="'+c+'" stroke-width="3" stroke-dasharray="6 5"/>';};
    u+=poly(b.pts,COL.blue);if(im)u+=poly(im.pts,COL.pink);}
  if(im){b.pts.forEach(function(p,j){var q=im.pts[j];
    if(im.move.type==='turn'){var r=Math.sqrt(p.x*p.x+p.y*p.y)*U;if(r>1){var sw=im.move.turn==='cw90'?1:0;u+='<path d="M '+gx(p.x)+' '+gy(p.y)+' A '+r+' '+r+' 0 0 '+sw+' '+gx(q.x)+' '+gy(q.y)+'" fill="none" stroke="'+COL.pink+'" stroke-width="3" stroke-dasharray="6 5"/>';}}
    else u+='<line x1="'+gx(p.x)+'" y1="'+gy(p.y)+'" x2="'+gx(q.x)+'" y2="'+gy(q.y)+'" stroke="'+COL.pink+'" stroke-width="3" stroke-dasharray="6 5"/>';});}
  var ch=mis?mis.e:L.emoji;
  b.pts.forEach(function(p,j){var gs=gsize(b.k);o+=halo(p.x,p.y,COL.blueS,gs*0.75)+emojiAt(p.x,p.y,ch,b.M,gs)+lab(p.x,p.y,LET[j],COL.blue);});
  if(im)im.pts.forEach(function(p,j){var gs=gsize(im.k);o+=halo(p.x,p.y,COL.pinkS,gs*0.75)+emojiAt(p.x,p.y,ch,im.M,gs)+lab(p.x,p.y,LET[j]+'\u2032',COL.pink);});
  return grid({lines:true,under:u,over:o});
}

  return h+'</div></div>';

function labReset(full){var L=G.lab;L.dx=0;L.dy=0;L.mirror=null;L.turn=null;L.k=null;if(full){L.moves=[];L.res=null;}}
function setMission(i){var L=G.lab,m=MIS[i];L.mi=i;L.sx=m.s[0];L.sy=m.s[1];L.shape='single';L.res=null;labReset(true);}
function missionCheck(){
  var L=G.lab,m=MIS[L.mi],img=labImg(),p=(img||labBase()).pts[0],used=usedTypes();
  L.tries[L.mi]++;
  var okPos=Math.abs(p.x-m.t[0])<1e-9&&Math.abs(p.y-m.t[1])<1e-9,needOk=m.need.every(function(n){return used.indexOf(n)>=0;}),st='moves-mission-'+(L.mi+1);
  if(okPos&&needOk){L.mdone[L.mi]=true;var stars=L.tries[L.mi]===1?3:(L.tries[L.mi]<=3?2:1);
    L.res={c:'ok',k:'ms.ok',p:{e:m.e,pt:pt(p.x,p.y)}};
    log({event:'mission-complete',station:st,stageIndex:L.mi+1,correct:true,stars:stars,text:'used '+used.join('+')+' tries '+L.tries[L.mi]});}
  else if(okPos){L.res={c:'info',k:'ms.need',tk:{how:'how.'+m.how}};log({event:'mission-check',station:st,stageIndex:L.mi+1,correct:false,text:'landed-but-wrong-move used '+used.join('+')});}
  else{L.res={c:'bad',k:'ms.near',p:{pt:pt(p.x,p.y),tp:pt(m.t[0],m.t[1])}};log({event:'mission-check',station:st,stageIndex:L.mi+1,correct:false,text:'at '+ptL(p.x,p.y)+' target '+ptL(m.t[0],m.t[1])});}
}
function typeEn(ty){return {slide:'slide',flip:'flip',turn:'turn',resize:'resize'}[ty];}
function fillSentence(){
  var L=G.lab,b=labBase(),im=labImg(),ch=L.mode==='mission'?MIS[L.mi].e:L.emoji,sp=startPts()[0],fp=(im||b).pts[0],types=usedTypes().map(typeEn);
  var s='I moved the '+ch+' from '+pt(sp.x,sp.y)+' to '+pt(fp.x,fp.y)+'.';
  if(types.length)s+=' I used a '+types.join(' and a ')+'.';
  return s;
}
function wordCount(s){var m=s.trim().match(/\S+/g);return m?m.length:0;}

/* ---------- chrome: tabs, wall, static text ---------- */
function tabDone(id){
  if(id==='num')return G.num.gi>=NUMGOALS.length;
  if(id==='parts')return G.parts.done;
  if(id==='quad')return G.quad.done;
  if(id==='pairs')return G.pairs.done.every(Boolean);
  if(id==='prac')return G.prac.done;

}
function renderTabs(){

function applyStatic(){
  document.documentElement.lang=S.lang;
  var els=document.querySelectorAll('[data-i18n]'),i;
  for(i=0;i<els.length;i++)els[i].textContent=t(els[i].getAttribute('data-i18n'));

  for(i=0;i<bs.length;i++)bs[i].setAttribute('aria-pressed',bs[i].getAttribute('data-v')===S.lang?'true':'false');

var PANELS={num:pNum,parts:pParts,quad:pQuad,pairs:pPairs,prac:pPrac,moves:pMoves};
function focusKey(el){if(!el||!el.getAttribute)return null;var a=el.getAttribute('data-act');if(!a)return null;return [a,el.getAttribute('data-v'),el.getAttribute('data-k'),el.getAttribute('data-d'),el.getAttribute('data-id'),el.getAttribute('data-q'),el.getAttribute('data-a'),el.getAttribute('data-e'),el.getAttribute('data-i')].join('|');}
var lastLive='';
function render(){
  renderTabs();
  var p=$('#panel');p.setAttribute('aria-labelledby','tab-'+S.tab);
  p.innerHTML=PANELS[S.tab]();
}
function refresh(announce){
  var fk=focusKey(document.activeElement);
  render();
  if(fk){var all=document.querySelectorAll('[data-act]'),i;for(i=0;i<all.length;i++){if(focusKey(all[i])===fk){try{all[i].focus({preventScroll:true});}catch(e){}break;}}}
  if(announce){var f=$('#panel .fb');var txt=f?f.textContent:'';if(txt&&txt!==lastLive){lastLive=txt;var lv=$('#live');lv.textContent='';setTimeout(function(){lv.textContent=txt;},50);}}
}

/* ---------- actions ---------- */
function stepKey(k,d){
  var P=G.prac,L=G.lab;
  if(k==='pr.x'){G.pairs.x=clamp(G.pairs.x+d,-R,R);G.pairs.t=null;clearInterval(walkTimer);pairsGoals();}
  else if(k==='pr.y'){G.pairs.y=clamp(G.pairs.y+d,-R,R);G.pairs.t=null;clearInterval(walkTimer);pairsGoals();}
  else if(k==='pc.x'||k==='pc.y'){if(P.res&&P.res.code==='correct')return;var o=P.mode==='plot'?P.pick:P.ans,a=k==='pc.x'?'x':'y';o[a]=clamp(o[a]+d,-R,R);if(P.mode==='plot')o.set=true;P.res=null;}
  else if(k==='lab.dx'){L.dx=clamp(L.dx+d,-R,R);logOnce('tool-slide',{event:'tool-first-use',station:'moves',text:'slide'});}
  else if(k==='lab.dy'){L.dy=clamp(L.dy+d,-R,R);logOnce('tool-slide',{event:'tool-first-use',station:'moves',text:'slide'});}
  else if(k==='lab.sx'){L.sx=clamp(L.sx+d,-6,6);L.moves=[];labReset(false);}
  else if(k==='lab.sy'){L.sy=clamp(L.sy+d,-6,6);L.moves=[];labReset(false);}
}
function goTab(id){clearInterval(walkTimer);G.pairs.t=null;S.tab=id;logStart();logOnce('tab-'+id,{event:'tab-view',station:'tab-'+id,text:id});refresh();window.scrollTo(0,0);}
function setLang(l){S.lang=l;store('lang',l);applyStatic();refresh();}
function act(el){
  var a=el.getAttribute('data-act'),d=el.dataset,n=G.num,P=G.parts,Q=G.quad,PR=G.prac,L=G.lab,ann=true;
  switch(a){
    case 'lang':setLang(d.v);return;
    case 'tab':goTab(d.v);return;
    case 'newstudent':
      if(window.confirm(t('id.confirm'))){S.name='';S.period='';S.write='';store('name',null);store('period',null);store('write',null);$('#id-name').value='';$('#id-period').value='';G=fresh();once={};started=false;clearInterval(walkTimer);S.tab='num';}
      break;
    case 'hop':{
      n.pos=clamp(n.pos+Number(d.d),-R,R);n.msg=null;var g=NUMGOALS[n.gi];
      if(g&&((g.o==='v')===n.vert)&&n.showY===(g.o==='v'||n.showY)&&n.pos===g.n){
        log({event:'goal',station:'number-lines',stageIndex:n.gi+1,correct:true,text:(g.o==='h'?'x ':'y ')+g.n});
        n.msg={c:'ok',k:'num.found',p:{n:fmt(g.n)}};n.gi++;n.pos=0;}
      break;}
    case 'line':n.vert=d.v==='v';n.pos=0;n.msg=null;break;
    case 'addY':n.showY=true;break;
    case 'addGrid':n.showGrid=true;break;
    case 'resetNum':G.num=fresh().num;break;
    case 'part':P.hi=d.id;logOnce('part-'+d.id,{event:'part-view',station:'parts',text:d.id});break;
    case 'findagain':P.fi=0;P.done=false;P.msg=null;break;
    case 'qmode':Q.mode=d.v;break;
    case 'qhi':Q.hi=Q.hi===d.q?null:d.q;break;
    case 'qans':{
      if(Q.pick!==null)return;Q.pick=d.a;var z=Q.qs[Q.i],ok=d.a===z.ans;if(ok)Q.right++;
      log({event:'answer',station:'quadrants-quiz',stageIndex:Q.i+1,correct:ok,text:ptL(z.x,z.y)+' picked '+d.a+' answer '+z.ans});break;}
    case 'qnext':Q.i++;Q.pick=null;if(Q.i>=Q.qs.length){Q.i=Q.qs.length-1;Q.done=true;log({event:'quiz-complete',station:'quadrants-quiz',stars:Q.right,text:Q.right+' of '+Q.qs.length});}break;
    case 'qagain':Q.qs=genQuiz();Q.i=0;Q.pick=null;Q.right=0;Q.done=false;break;
    case 'step':stepKey(d.k,Number(d.d));ann=false;break;
    case 'walk':doWalk();ann=false;break;
    case 'swap':G.pairs.swap=!G.pairs.swap;logOnce('swap',{event:'swap',station:'pairs',text:ptL(G.pairs.x,G.pairs.y)});break;
    case 'pmode':PR.mode=d.v;pracReset();break;
    case 'plevel':PR.level=Number(d.v);pracReset();break;
    case 'pcheck':pracCheck();break;
    case 'phint':PR.hint=true;logOnce('hint-'+PR.level+'-'+PR.mode+'-'+PR.i,{event:'hint',station:'practice-L'+PR.level+'-'+PR.mode,stageIndex:PR.i+1,text:'hint requested'});break;
    case 'pnext':pracAdvance();break;
    case 'pskip':log({event:'skip',station:'practice-L'+PR.level+'-'+PR.mode,stageIndex:PR.i+1,correct:false,text:'skipped after '+PR.misses+' misses'});pracAdvance();break;
    case 'pagain':pracReset();break;
    case 'lmode':L.mode=d.v;if(d.v==='mission')setMission(L.mi);else{labReset(true);}break;
    case 'mis':setMission(Number(d.i));break;
    case 'mcheck':missionCheck();break;
    case 'mnext':setMission(Math.min(L.mi+1,MIS.length-1));break;
    case 'lemoji':L.emoji=d.e;break;
    case 'lshape':L.shape=d.v;L.moves=[];labReset(false);break;
    case 'ltool':L.tool=d.v;labReset(false);logOnce('tool-'+d.v,{event:'tool-first-use',station:'moves',text:d.v});break;
    case 'lmirror':L.mirror=d.v;break;
    case 'lturn':L.turn=d.v;break;
    case 'lk':L.k=Number(d.v);break;
    case 'lkeep':{var m=labPend();if(!m)return;L.moves.push(m);labReset(false);L.res=null;
      log({event:'move-keep',station:L.mode==='mission'?'moves-mission-'+(L.mi+1):'moves-free',stageIndex:L.moves.length,text:m.type+' '+ruleAlg(m)});break;}
    case 'lundo':L.moves.pop();L.res=null;break;
    case 'lrestart':labReset(true);break;
    case 'wfill':{var s=fillSentence();S.write=(S.write&&!/\n$/.test(S.write)?S.write+'\n':S.write)+s;store('write',S.write);ann=false;break;}
    case 'wcopy':copyWrite();return;
    case 'wdl':downloadWrite();return;
    default:return;
  }
  refresh(ann);
}

function gridClick(svg,e){
  var r=svg.getBoundingClientRect();if(!r.width)return;
  var px=(e.clientX-r.left)/r.width*612,py=(e.clientY-r.top)/r.height*612,ux=(px-C)/U,uy=(C-py)/U,id=svg.getAttribute('data-grid');
  if(id==='parts'){
    var P=G.parts;if(P.done)return;var h=hitTest(ux,uy),f=FIND[P.fi],ok=findOK(f.id,h);
    log({event:'answer',station:'parts-find',stageIndex:P.fi+1,correct:ok,text:'target '+f.id+' tapped '+h});
    if(ok){P.fi++;P.msg={c:'ok',k:'find.yes'};if(P.fi>=FIND.length){P.fi=FIND.length-1;P.done=true;log({event:'find-complete',station:'parts-find',correct:true,text:'all found'});}}
    else P.msg={c:'bad',k:'find.no',tk:{where:'where.'+h}};
    refresh(true);
  }else if(id==='quad'&&G.quad.mode==='explore'){
    var x=Math.round(ux),y=Math.round(uy);if(Math.abs(x)>R||Math.abs(y)>R)return;
    G.quad.p={x:x,y:y};G.quad.hi=null;logOnce('quad-drop',{event:'explore-drop',station:'quadrants',text:ptL(x,y)});refresh(false);
  }else if(id==='prac'){
    var PR=G.prac;if(PR.mode!=='plot'||PR.done||(PR.res&&PR.res.code==='correct'))return;
    var x2=Math.round(ux),y2=Math.round(uy);if(Math.abs(x2)>R||Math.abs(y2)>R)return;
    PR.pick={x:x2,y:y2,set:true};PR.res=null;refresh(false);
  }
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;
  if(el){act(el);return;}
  var g=e.target.closest?e.target.closest('svg[data-grid]'):null;
  if(g)gridClick(g,e);
});
document.addEventListener('pointerdown',logStart);
document.addEventListener('keydown',function(e){
  logStart();
  var tb=e.target.closest?e.target.closest('.tab'):null;
  if(tb&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
    var i=TABS.indexOf(S.tab),j=(i+(e.key==='ArrowRight'?1:TABS.length-1))%TABS.length;goTab(TABS[j]);
    var nt=$('#tab-'+TABS[j]);if(nt)nt.focus();e.preventDefault();
  }
});
document.addEventListener('input',function(e){
  var id=e.target&&e.target.id;
  if(id==='id-name'){S.name=e.target.value.trim();store('name',S.name);}
  else if(id==='id-period'){S.period=e.target.value.trim();store('period',S.period);}
  else if(id==='w-text'){S.write=e.target.value;store('write',S.write);logOnce('write-start',{event:'write-start',station:'moves-write',text:'started writing'});}
});

/* ---------- start ---------- */
(function init(){
  var l=store('lang');if(l==='es'||l==='en')S.lang=l;
  S.name=store('name')||'';S.period=store('period')||'';S.write=store('write')||'';
  $('#id-name').value=S.name;$('#id-period').value=S.period;
  applyStatic();render();
})();
})();
</script>
</body>
</html>
